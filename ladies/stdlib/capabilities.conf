# Marmelade native-backend capability model.
#
# Requirements point from a consumer leaf toward a platform root. Multiple
# providers of the same capability are alternatives; a provider's comma-separated
# requirements are all required. Provider order is preference order.

root Native_MacOS
root Native_Linux
root Native_Windows
root Wasm_Node
root Wasm_Browser

capability Threads
capability Terminal
capability MMap
capability File_System
capability Timer
capability Browser
capability Dom
capability Local_Storage
capability Fetch
capability Socket
capability Web_Socket
capability GPU

provider MacOS_Threads provides Threads requires Native_MacOS defines MARM_PROVIDER_THREADS_POSIX
provider Linux_Threads provides Threads requires Native_Linux defines MARM_PROVIDER_THREADS_POSIX

provider MacOS_Terminal provides Terminal requires Native_MacOS defines MARM_PROVIDER_TERMINAL_POSIX
provider Linux_Terminal provides Terminal requires Native_Linux defines MARM_PROVIDER_TERMINAL_POSIX
provider Node_Terminal provides Terminal requires Wasm_Node defines MARM_PROVIDER_TERMINAL_NODE

provider MacOS_MMap provides MMap requires Native_MacOS defines MARM_PROVIDER_MMAP_POSIX
provider Linux_MMap provides MMap requires Native_Linux defines MARM_PROVIDER_MMAP_POSIX

provider MacOS_File_System provides File_System requires Native_MacOS defines MARM_PROVIDER_FILE_SYSTEM_POSIX
provider Linux_File_System provides File_System requires Native_Linux defines MARM_PROVIDER_FILE_SYSTEM_POSIX
provider Windows_File_System provides File_System requires Native_Windows defines MARM_PROVIDER_FILE_SYSTEM_WINDOWS
provider Node_File_System provides File_System requires Wasm_Node defines MARM_PROVIDER_FILE_SYSTEM_NODE

provider MacOS_Timer provides Timer requires Native_MacOS defines MARM_PROVIDER_TIMER_POSIX
provider Linux_Timer provides Timer requires Native_Linux defines MARM_PROVIDER_TIMER_POSIX
provider Windows_Timer provides Timer requires Native_Windows defines MARM_PROVIDER_TIMER_WINDOWS
provider Node_Timer provides Timer requires Wasm_Node defines MARM_PROVIDER_TIMER_WASM
provider Browser_Timer provides Timer requires Wasm_Browser defines MARM_PROVIDER_TIMER_WASM

provider Browser_Runtime provides Browser requires Wasm_Browser defines MARM_PROVIDER_BROWSER
provider Browser_DOM provides Dom requires Browser defines MARM_PROVIDER_DOM_BROWSER
provider Browser_Local_Storage provides Local_Storage requires Browser defines MARM_PROVIDER_LOCAL_STORAGE_BROWSER

provider Browser_Fetch provides Fetch requires Browser defines MARM_PROVIDER_FETCH_BROWSER
provider Node_Fetch provides Fetch requires Wasm_Node defines MARM_PROVIDER_FETCH_NODE

provider MacOS_Socket provides Socket requires Native_MacOS defines MARM_PROVIDER_SOCKET_POSIX
provider Linux_Socket provides Socket requires Native_Linux defines MARM_PROVIDER_SOCKET_POSIX
provider Windows_Socket provides Socket requires Native_Windows defines MARM_PROVIDER_SOCKET_WINDOWS
provider Node_Socket provides Socket requires Wasm_Node defines MARM_PROVIDER_SOCKET_NODE

# WebSocket deliberately has two parents: browsers provide it directly, while a
# native implementation can be built over Socket. This is why the model is a graph.
provider Browser_Web_Socket provides Web_Socket requires Browser defines MARM_PROVIDER_WEB_SOCKET_BROWSER
provider Socket_Web_Socket provides Web_Socket requires Socket,Timer defines MARM_PROVIDER_WEB_SOCKET_SOCKET

provider Browser_GPU provides GPU requires Browser defines MARM_PROVIDER_GPU_WEB
provider MacOS_GPU provides GPU requires Native_MacOS defines MARM_PROVIDER_GPU_MACOS
provider Linux_GPU provides GPU requires Native_Linux defines MARM_PROVIDER_GPU_LINUX
provider Windows_GPU provides GPU requires Native_Windows defines MARM_PROVIDER_GPU_WINDOWS
