[workspace]
# The language server lives in its own crate so the compiler keeps its five
# dependencies: nothing in `lukas` should have to build serde to compile a program.
members = ["lsp"]
# The Zed extension is a wasm component built against Zed's own API, not part of
# this workspace's host build.
exclude = ["editors/zed"]

[package]
name = "lukas"
version = "0.1.0"
edition = "2024"
default-run = "lukas"

[dependencies]
backtrace = "0.3.76"
clap = { version = "4.5.54", features = ["derive"] }
thiserror = "2.0.17"
tracing = { version = "0.1.44", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["fmt", "std", "env-filter"] }
